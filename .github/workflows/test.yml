name: test

# Builds the first-party plugins, then vets, tests and builds vpnw on every
# push to main and every pull request, on Linux and macOS. A green run on
# main lets the release workflow publish the version in
# internal/version/version.go if it has no tag yet.
#
# The sealed-backend tests need unprivileged user and network namespaces.
# On Linux, VPNW_REQUIRE_SEAL=1 makes them fail rather than skip when the
# runner can't provide them, and VPNW_REQUIRE_IPV6=1 does the same for the
# bypass matrix's IPv6 rows. The matrix is kept as the bypass-matrix
# artifact, in the run's summary and as an annotation; tools/record-results.sh
# reads the annotation back for machines without IPv6.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Let the sealed tests run (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor stops unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the built-in plugins from this commit
        run: sh tools/build-plugins.sh
      - run: go vet ./...
      - name: go test -count=1 ./...
        shell: bash
        env:
          VPNW_REQUIRE_SEAL: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          set -o pipefail
          if go test -count=1 -timeout 20m ./... 2>&1 | tee "$RUNNER_TEMP/test.log"; then exit 0; fi
          # Failures as annotations too, so they can be read from the API
          # without the full log.
          grep -E -B2 -A12 -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/test.log" \
            | head -c 60000 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' > "$RUNNER_TEMP/fail.txt" || true
          echo "::error title=go test failed::$(cat "$RUNNER_TEMP/fail.txt")"
          exit 1
      - name: Bypass matrix, IPv6 included (Linux)
        if: runner.os == 'Linux'
        env:
          VPNW_REQUIRE_SEAL: '1'
          VPNW_REQUIRE_IPV6: '1'
        run: |
          VPNW_MATRIX_OUT="$RUNNER_TEMP/bypass-matrix.md" go test -count=1 -run '^TestBypassMatrix$' -v ./test/integration/
          {
            echo "date: $(date -u +%Y-%m-%d)"
            echo "commit: $(git rev-parse --short HEAD)"
            echo "kernel: $(uname -sr), $(uname -m), $(nproc) CPUs"
            echo "runner: GitHub Actions ${{ matrix.os }}, run ${{ github.run_id }}"
            echo
            cat "$RUNNER_TEMP/bypass-matrix.md"
          } > "$RUNNER_TEMP/bypass-matrix-ci.md"
          cat "$RUNNER_TEMP/bypass-matrix-ci.md" >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which tools/record-results.sh reads back
          # through the API on machines without IPv6.
          echo "::notice title=bypass-matrix::$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$RUNNER_TEMP/bypass-matrix-ci.md")"
      - name: Keep the bypass matrix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bypass-matrix
          path: ${{ runner.temp }}/bypass-matrix-ci.md
      - name: Build and smoke-test vpnw
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/vpnw
          sh tools/smoke.sh bin
